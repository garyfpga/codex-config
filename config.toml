approval_policy = "never"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"
model = "gpt-5.5"
model_reasoning_effort = "high"
model_context_window = 400000
model_auto_compact_token_limit = 360000
plan_mode_reasoning_effort = "high"
[projects."/home/gary"]
trust_level = "trusted"

[projects."/home/gary/git/cffex"]
trust_level = "trusted"

[projects."/home/gary/.codex"]
trust_level = "trusted"

[projects."/home/gary/git/simplepower"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "run-state", "context-used", "task-progress", "five-hour-limit", "weekly-limit", "codex-version", "context-window-size", "session-id", "fast-mode"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]

[plugins."superpowers@openai-curated"]
enabled = true

