approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
dangerously_trust_all_projects = true
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"

service_tier = "default"

[features]
hooks = true
multi_agent = true
remote_connections = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "run-state", "context-used", "five-hour-limit", "weekly-limit", "codex-version", "fast-mode"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]

[agents]
max_threads = 30

[notice]
fast_default_opt_out = true

[remote_compact]
max_attempts = 2
attempt_timeout_sec = 600
tcp_keepalive_interval_ms = 1000
