approval_policy = "never"
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
dangerously_trust_all_projects = true
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_verbosity = "low"
model_reasoning_summary = "none"
#model_context_window = 1000000
#model_auto_compact_token_limit = 900000

service_tier = "default"

[features]
hooks = true
multi_agent = true
remote_connections = true

[features.multi_agent_v2]
hide_spawn_agent_metadata = false
tool_namespace = "agents"

[tui]
alternate_screen = "never"
status_line = ["weekly-limit", "model-with-reasoning", "context-used", "current-dir", "run-state", "context-window-size", "five-hour-limit", "codex-version", "fast-mode"]
status_line_use_colors = true
session_picker_view = "dense"

[tui.keymap.editor]
insert_newline = ["ctrl-j", "ctrl-m", "enter", "shift-enter", "alt-enter"]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
"gpt-5.6-terra" = 4
"gpt-5.6-luna" = 4

[agents]
max_concurrent_threads_per_session = 30

[notice]
fast_default_opt_out = true
hide_rate_limit_model_nudge = true

[remote_compact]
max_attempts = 2
attempt_timeout_sec = 600
tcp_keepalive_interval_ms = 1000

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

